name: Bug report
description: Report a defect — existing behavior is wrong or broken
title: "[bug]: "
type: Bug
labels: ["status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A maintainer will triage and label this during review.
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: A clear description of the defect.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - chat / conversations
        - knowledge bases / RAG
        - plugin configuration
        - marketplace
        - settings / auth
        - model management
        - monitoring / admin
        - build / tooling
        - not sure
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment & logs
      description: Browser/OS, Minder version, and any console errors.
      render: shell
