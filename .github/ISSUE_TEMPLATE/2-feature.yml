name: Feature request
description: Propose a new capability or enhancement
title: "[feature]: "
type: Feature
labels: ["status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - chat / conversations
        - knowledge bases / RAG
        - plugin configuration
        - marketplace
        - settings / auth
        - model management
        - monitoring / admin
        - build / tooling
        - not sure
    validations:
      required: true
