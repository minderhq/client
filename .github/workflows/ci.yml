name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [main]
    paths-ignore: [ '**/*.md' ]

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Typecheck, Test & Build
    # Always GitHub-hosted. This repo is public, so self-hosted push CI queues
    # forever behind the org runner group's allows_public_repositories=false gate
    # (confirmed live: main runs sat queued for hours, then were cancelled).
    # Hosted minutes are free for a public repo, and fork PRs already ran hosted,
    # so nothing external newly executes on our infra. (The docker job's type=gha
    # cache is runner-independent, so self-hosted gave it nothing here anyway.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: API contract drift check
        # The committed openapi/api-gateway.json must match the spec published
        # on the docs site, and src/lib/api-types.gen.ts must be its output.
        # The Test step's apiContract.test.ts then checks the client's calls
        # against it. To fix: see README "API contract".
        run: |
          curl -fsSL --retry 3 -o openapi/api-gateway.json \
            https://raw.githubusercontent.com/minderhq/docs/main/docs/api/openapi/api-gateway.json
          npm run gen:api
          if ! git diff --exit-code --stat -- openapi src/lib/api-types.gen.ts; then
            echo "::error::openapi/api-gateway.json or src/lib/api-types.gen.ts is out of sync with the published gateway spec. Run the sync in README 'API contract' and commit the result."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    # Always GitHub-hosted. This repo is public, so self-hosted push CI queues
    # forever behind the org runner group's allows_public_repositories=false gate
    # (confirmed live: main runs sat queued for hours, then were cancelled).
    # Hosted minutes are free for a public repo, and fork PRs already ran hosted,
    # so nothing external newly executes on our infra. (The docker job's type=gha
    # cache is runner-independent, so self-hosted gave it nothing here anyway.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        # A plain `docker build` here had no layer caching at all -- on
        # pull_request (always a fresh ubuntu-latest VM, no persistent Docker
        # daemon the way a self-hosted runner has), every single PR reran the
        # Dockerfile's own `npm ci` from scratch inside the image build, on
        # top of the separate `npm ci` the build job above already does at
        # the workflow level (setup-node's npm cache only covers that job,
        # never a sibling job's Docker-internal build). GitHub Actions' own
        # cache backend (type=gha) gives buildx a persistent layer cache
        # across runs regardless of runner type -- validation-only build
        # (push: false), nothing is published from here.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: minder-client:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
