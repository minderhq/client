name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [main]
    paths-ignore: [ '**/*.md' ]

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Typecheck, Test & Build
    # push (trusted, post-merge) runs on the org's self-hosted pool; pull_request
    # (including from forks -- this repo is public) stays on GitHub-hosted so an
    # external contributor's PR never executes on our infrastructure.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","Linux","X64","org-shared"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    # push (trusted, post-merge) runs on the org's self-hosted pool; pull_request
    # (including from forks -- this repo is public) stays on GitHub-hosted so an
    # external contributor's PR never executes on our infrastructure.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","Linux","X64","org-shared"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t minder-console:ci .
