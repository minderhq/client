<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minder</title>
    <!-- Applies the theme class before first paint, so a "dark" preference
         doesn't flash light (or vice versa) while the JS bundle loads. A
         plain (blocking, non-module) script from public/, not an inline one:
         the Content-Security-Policy nginx sends allows only script-src 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
