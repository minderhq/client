# Security response headers. docker/security-headers.sh writes the two
# included snippets at container start (empty when CLIENT_SECURITY_HEADERS=off):
# security-headers.conf has Content-Security-Policy, X-Content-Type-Options,
# X-Frame-Options and HSTS; referrer-policy.conf has Referrer-Policy. nginx
# drops server-level add_header lines in any location that has its own, so
# every such location includes them again. src/nginxConfig.test.ts checks this.
#
# HSTS only when the TLS front door (Traefik) forwarded an HTTPS request; an
# empty value sends no header. Over plain HTTP a browser ignores HSTS anyway,
# so a forged X-Forwarded-Proto on the loopback port gains nothing.
map $http_x_forwarded_proto $minder_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 8009;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/minder/security-headers.conf;
    include /etc/nginx/minder/referrer-policy.conf;

    location = /health {
        return 200 "OK\n";
        add_header Content-Type text/plain always;
        include /etc/nginx/minder/security-headers.conf;
        include /etc/nginx/minder/referrer-policy.conf;
    }

    # Password reset links carry their token in the URL fragment. Make sure
    # the page that reads it never sends a Referer to anything it loads and
    # is never cached. ResetPasswordPage adds a matching
    # <meta name="referrer"> as a fallback. A case-insensitive regex with an
    # optional trailing slash, because React Router matches routes that way:
    # /Reset-Password/ renders the same page and needs the same headers.
    # src/nginxConfig.test.ts checks this block.
    location ~* ^/reset-password/?$ {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        include /etc/nginx/minder/security-headers.conf;
        try_files /index.html =404;
    }

    # Email verification links carry their token in the fragment too
    # (/verify-email#token=...): the same headers as the reset page, and
    # VerifyEmailPage adds the same <meta name="referrer"> fallback.
    location ~* ^/verify-email/?$ {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        include /etc/nginx/minder/security-headers.conf;
        try_files /index.html =404;
    }

    # Invite links carry their token in the path (/invite/<token>), and the
    # page hosts a create-account password form: the same no-referrer /
    # no-store treatment as the reset page, so the token never leaks in a
    # Referer and the page is never cached. InviteRedeemPage adds the same
    # <meta name="referrer"> fallback. Case-insensitive like React Router.
    # Everything under /invite/, not just one segment: nginx matches the
    # DECODED path, so a token with an encoded slash (/invite/a%2Fb, which the
    # router still renders as the invite page) arrives here as /invite/a/b.
    location ~* ^/invite/. {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        include /etc/nginx/minder/security-headers.conf;
        try_files /index.html =404;
    }

    # SPA fallback -- React Router paths like /plugin-config and
    # /model-management aren't real files on disk, so a direct hit or a
    # browser refresh on either must still resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
