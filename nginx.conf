server {
    listen 8009;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        return 200 "OK\n";
        add_header Content-Type text/plain always;
    }

    # Token routes: pages opened from an emailed account link whose one-time
    # secret is in the URL fragment (/reset-password#token=...). The fragment
    # never reaches this server; these headers stop the page leaking its URL in
    # a Referer and keep it out of browser and proxy caches (email ADR Decision
    # 5, "Links"). index.html is served right here with `try_files ... =404`,
    # not through the SPA fallback below: that fallback is an internal redirect
    # to /index.html, which would be handled by `location /` and drop these
    # headers. The page adds a matching <meta name="referrer"> as a fallback
    # (src/lib/tokenPage.ts). `~*` is case-insensitive because React Router
    # matches routes case-insensitively: /Reset-Password renders the same page
    # and needs the same headers. Add future token routes to this regex;
    # src/nginxConfig.test.ts checks it.
    location ~* ^/reset-password/?$ {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # SPA fallback -- React Router paths like /plugin-config and
    # /model-management aren't real files on disk, so a direct hit or a
    # browser refresh on either must still resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
